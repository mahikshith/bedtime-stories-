<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/assets/fonts.css">
<style>body{margin:0;background:#E8DCC8}canvas{display:block;width:100%}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { THINGS, THING_IDS, drawThing } from "/src/js/games/town/things.js";
import { text } from "/src/js/core/draw.js";
const cols=5, cell=150, rows=Math.ceil(THING_IDS.length/cols);
const W=cols*cell, H=rows*cell+40, dpr=2;
const c=document.getElementById("c");
c.width=W*dpr;c.height=H*dpr;c.style.height=H+"px";
const x=c.getContext("2d");x.scale(dpr,dpr);
x.fillStyle="#E8DCC8";x.fillRect(0,0,W,H);
text(x,"TINKER TOWN — things you can pick up",W/2,22,{size:17,color:"#4A3218"});
THING_IDS.forEach((id,i)=>{
  const cx=(i%cols)*cell+cell/2, cy=Math.floor(i/cols)*cell+cell/2+40;
  x.save();x.globalAlpha=.18;x.beginPath();
  x.ellipse(cx,cy+42,34,10,0,0,Math.PI*2);x.fillStyle="#000";x.fill();x.restore();
  drawThing(x,id,cx,cy,150,{hot:id==="pot",soup:id==="pot",t:1.2,hue:1});
  text(x,THINGS[id].name,cx,cy+62,{size:12,color:"#6B4A22"});
});
</script></body></html>
