<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Great job!</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body { display: grid; place-items: center; padding: 24px; min-height: 100vh; }
  .result { width: min(430px, 100%); text-align: center; }
  .result__bird { width: 190px; height: 190px; margin: 0 auto 6px; }
  .result__bird canvas { width: 100%; height: 100%; display: block; }
  .result__title { font-family: var(--font-display); font-size: 42px; color: var(--bee); margin: 0 0 6px; }
  .result__sub { color: var(--text-dim); font-size: 17px; margin-bottom: 20px; }
  .stars { display: flex; justify-content: center; gap: 14px; margin-bottom: 22px; }
  .stars span {
    font-size: 48px; filter: grayscale(1) brightness(0.45);
    transform: scale(0.7); opacity: 0;
    animation: pop-in 420ms cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  .stars span.on { filter: none; }
  .stars span:nth-child(2) { animation-delay: 180ms; }
  .stars span:nth-child(3) { animation-delay: 360ms; }
  @keyframes pop-in { to { transform: scale(1); opacity: 1; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tile { border-radius: 16px; padding: 14px 10px; border: 2px solid var(--ink-line); background: var(--ink-raised); }
  .tile__label { font-size: 11px; letter-spacing: 1.2px; color: var(--text-dim); }
  .tile__value { font-family: var(--font-display); font-size: 26px; margin-top: 4px; }
  .actions { display: grid; gap: 12px; }
</style>
</head>
<body>
<div class="result" id="result"></div>
<script type="module">
import { drawBird } from "./js/art/bird.js";
import { sfx, install, unlock } from "./js/core/audio.js";
import { save } from "./js/core/storage.js";
import { C } from "./js/core/palette.js";
import { fadeIn, navigate } from "./js/core/nav.js";

install();
fadeIn();
const q = new URLSearchParams(location.search);
const game = q.get("game") ?? "say-jump";
const level = parseInt(q.get("level") ?? "0", 10);
const stars = Math.max(0, Math.min(3, parseInt(q.get("stars") ?? "0", 10)));

const TITLES = [
  "Nice try!", "Good job!", "Great work!", "Perfect!",
];
const NEXT = {
  "say-jump": "src/games/say-jump.html",
  "tilt-maze": "src/games/tilt-maze.html",
  "word-mob": "src/games/word-mob.html",
  "echo-pop": "src/games/echo-pop.html",
  "tangram": "src/games/tangram.html",
  "slide": "src/games/slide.html",
  "shapes": "src/games/shapes.html",
  "robot": "src/games/robot.html",
  "balance": "src/games/balance.html",
};

/** Per-game result tiles, so each game reports what it actually measured. */
function tiles() {
  const n = (k) => q.get(k);
  switch (game) {
    case "say-jump":
      return [["WORDS", `${n("words") ?? 0}/${n("asked") ?? 0}`],
              ["STARS", `${n("got") ?? 0}/${n("total") ?? 0}`]];
    case "tilt-maze":
      return [["WORD", (n("word") ?? "").toUpperCase()],
              ["FALLS", n("falls") ?? "0"]];
    case "word-mob":
      return [["FLOCK", n("flock") ?? "0"],
              ["GATES", `${n("words") ?? 0}/${n("asked") ?? 0}`]];
    case "echo-pop":
      return [["FOUND", `${n("found") ?? 0}/${n("rounds") ?? 0}`]];
    case "tangram":
      return [["SHAPE", (n("name") ?? "").toUpperCase()],
              ["HINTS", n("hints") ?? "0"]];
    case "slide":
      return [["MOVES", n("moves") ?? "0"], ["BEST", n("par") ?? "-"]];
    case "shapes":
      return [["SORTED", `${n("placed") ?? 0}/${n("total") ?? 0}`]];
    case "robot":
      return [["BLOCKS", n("blocks") ?? "0"], ["SHORTEST", n("best") ?? "-"]];
    case "balance":
      return [["MOVES", n("moves") ?? "0"], ["BEST", n("par") ?? "-"]];
    default:
      return [];
  }
}

const root = document.getElementById("result");
const birdBox = document.createElement("div");
birdBox.className = "result__bird";
const cv = document.createElement("canvas");
const dpr = Math.min(devicePixelRatio || 1, 2);
cv.width = 190 * dpr; cv.height = 190 * dpr;
birdBox.append(cv);
root.append(birdBox);

root.insertAdjacentHTML("beforeend", `
  <h1 class="result__title">${TITLES[stars]}</h1>
  <div class="result__sub">${stars === 3 ? "You got every single one." : "Play again to earn more stars."}</div>
  <div class="stars">
    ${[0,1,2].map(i => `<span class="${i < stars ? "on" : ""}">⭐</span>`).join("")}
  </div>
  <div class="tiles">
    ${tiles().map(([l,v]) => `<div class="tile"><div class="tile__label">${l}</div><div class="tile__value">${v}</div></div>`).join("")}
    <div class="tile"><div class="tile__label">TOTAL XP</div><div class="tile__value" style="color:var(--beetle)">${save.state.xp}</div></div>
  </div>
  <div class="actions">
    <button class="btn btn--wide" id="next">CONTINUE</button>
    <button class="btn btn--wide btn--ghost" id="again">PLAY AGAIN</button>
    <button class="btn btn--wide btn--ghost" id="home">BACK TO MAP</button>
  </div>
`);

// Celebrate on arrival: the bird's reaction is the reward.
const ctx = cv.getContext("2d");
ctx.scale(dpr, dpr);
let t = 0;
const state = stars >= 2 ? "cheer" : stars === 1 ? "idle" : "hurt";
(function loop() {
  t += 1 / 60;
  ctx.clearRect(0, 0, 190, 190);
  drawBird(ctx, 95, 168, 130, { bird: save.state.bird || "chick", state, t, shadow: true });
  requestAnimationFrame(loop);
})();

unlock();
stars >= 2 ? sfx.fanfare() : sfx.coin();
[0,1,2].filter(i => i < stars).forEach((i) => setTimeout(() => sfx.star(i), 200 + i * 190));

// Through nav so the results screen leaves the same way every other
// screen does — this is the last page a child sees before the hub, and
// a white flash here undoes the fanfare that just played.
const go = (href) => { unlock(); sfx.whoosh(); navigate(href); };
const band = save.state.band || "mid";
const bird = save.state.bird || "chick";
const qs = (lv) => `?level=${lv}&band=${band}&bird=${bird}`;
document.getElementById("next").onclick = () => go(`../${NEXT[game]}${qs(level + 1)}`);
document.getElementById("again").onclick = () => go(`../${NEXT[game]}${qs(level)}`);
document.getElementById("home").onclick = () => go("../index.html");
</script>
</body>
</html>
