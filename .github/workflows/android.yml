# Build the Android app and publish the APK as a downloadable artifact.
#
# GitHub's ubuntu runners ship with the Android SDK already installed, which is
# the whole reason this exists: the development container this repo is worked
# on in has a JDK and Gradle but no SDK and no way to fetch one, so CI is where
# an APK can actually be produced. Every push to a working branch leaves a
# installable build attached to the run.
#
# The APK is a DEBUG build, signed with the standard debug keystore. It
# installs on any device with "install unknown apps" enabled and is meant for
# trying the thing on real hardware. It is deliberately not a release build:
# that needs an upload keystore, which is a secret and does not belong in a
# repository.

name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # `npm ci` rather than `npm install`: the lockfile is committed, and a
      # store build should never quietly float a dependency.
      - name: Install dependencies
        run: npm ci

      # www/ is a build artifact and is not committed, so it has to be
      # assembled before Capacitor can copy it into the native project.
      - name: Assemble the web app
        run: npm run build

      - name: Copy into the Android project
        run: npx cap sync android

      - name: Stamp the build number
        run: |
          # versionCode has to increase for every upload, and the run number is
          # the only monotonic counter available without keeping state.
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it something a human can recognise
        id: rename
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          NAME="word-quest-0.1.${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: word-quest-apk
          path: ${{ steps.rename.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Word Quest — debug APK"
            echo
            echo "**\`${{ steps.rename.outputs.name }}\`** — $(du -h '${{ steps.rename.outputs.name }}' | cut -f1)"
            echo
            echo "Download it from the **Artifacts** section at the bottom of this run's page."
            echo "On the phone, allow installing unknown apps for whatever opens the file, then tap it."
            echo
            echo "Debug build, debug keystore. Not for the Play Store."
          } >> "$GITHUB_STEP_SUMMARY"
