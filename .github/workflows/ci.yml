name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The built PWA, downloadable from the run summary — this is the
      # "see the app build" artifact.
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: lumi-dist-${{ github.sha }}
          path: dist
          retention-days: 14

  smoke:
    name: Browser smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # Drives onboarding -> rhyme -> cloze -> rhyme game, the colour and letters
      # pillars, adding a second child, and the games arcade. Every script fails
      # the job on any page or console error.
      #
      # Runners have no audio device, so the voice games exercise the
      # no-microphone fallback rather than the live meter; the meter itself is
      # covered by unit tests and needs a handset.
      #
      # The server starts inside this step rather than in one of its own. As two
      # steps, the backgrounded process survived all the way to job cleanup but
      # never bound the port, and its output went to a pipe the runner had
      # closed — so the job failed with thirty identical curl errors and nothing
      # to diagnose from. One step keeps the server's lifetime inside the shell
      # that owns it, and preview.log is printed on failure so that if it
      # happens again there is something to read.
      - name: Walk the app
        env:
          SHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 \
            > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
            echo "preview server never came up after 60s"
            echo "--- preview.log ---"; cat preview.log || true
            exit 1
          fi
          node scripts/walkthrough.cjs
          node scripts/pillars-shot.cjs
          node scripts/games-shot.cjs
          node scripts/motion-shot.cjs
          node scripts/nomic-walk.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: screenshots
          retention-days: 14
