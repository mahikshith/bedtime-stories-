name: Deploy preview to Pages

# Publishes the built PWA so the app can be opened in a browser rather than
# only downloaded as an artifact.
#
# Requires one manual step in the repository once: Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions". Until that is done this
# workflow will fail at the deploy step, which is why it does not run on PRs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      # vite.config.ts sets base: './', so the build works from a project
      # subpath without knowing the repository name.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
